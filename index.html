<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyApp — Регистрация</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="welcome">
            <h1>MyApp</h1>

            <p>
                Добро пожаловать!
            </p>

            <span>
                Создайте аккаунт и начните
                пользоваться приложением.
            </span>

            <div class="symbol">✦</div>
        </div>


        <div class="form">

            <h2>Создать аккаунт</h2>

            <p class="under">
                Заполните свои данные
            </p>


            <form>

                <label>Имя</label>

                <input
                    type="text"
                    placeholder="Введите ваше имя"
                    required
                >


                <label>Фамилия</label>

                <input
                    type="text"
                    placeholder="Введите вашу фамилию"
                    required
                >


                <label>Электронная почта</label>

                <input
                    type="email"
                    placeholder="example@gmail.com"
                    required
                >


                <label>Пароль</label>

                <input
                    type="password"
                    placeholder="Введите пароль"
                    required
                >


                <label>Дата рождения</label>

                <input
                    type="date"
                    required
                >


                <div class="agree">

                    <input
                        type="checkbox"
                        required
                    >

                    <span>
                        Я согласен с условиями использования
                    </span>

                </div>


                <button type="submit">
                    Создать аккаунт
                </button>

            </form>


            <p class="login">
                Уже есть аккаунт?
                <a href="#">Войти</a>
            </p>

        </div>

    </div>

</body>
</html>
